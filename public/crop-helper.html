<!DOCTYPE html>
<html>
<head>
  <title>Logo Cropper</title>
</head>
<body>
  <h1>Cropping Logo...</h1>
  <canvas id="canvas" style="display:none;"></canvas>
  <script>
    const img = new Image();
    img.src = '/images/logo.png';
    img.onload = function() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      // Get image data to find bounding box of non-white pixels
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      let minX = canvas.width;
      let maxX = 0;
      let minY = canvas.height;
      let maxY = 0;

      // Find boundaries of non-white (or non-transparent) pixels
      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          const idx = (y * canvas.width + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          const a = data[idx + 3];

          // Check if pixel is not white (threshold to handle compression artifacts)
          const isWhite = r > 240 && g > 240 && b > 240;
          const isTransparent = a < 10;

          if (!isWhite && !isTransparent) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (maxX >= minX && maxY >= minY) {
        // Add padding
        const padding = 15;
        const x = Math.max(0, minX - padding);
        const y = Math.max(0, minY - padding);
        const w = Math.min(canvas.width - x, (maxX - minX) + padding * 2);
        const h = Math.min(canvas.height - y, (maxY - minY) + padding * 2);

        // Draw cropped area to a new canvas
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = w;
        cropCanvas.height = h;
        const cropCtx = cropCanvas.getContext('2d');
        cropCtx.drawImage(canvas, x, y, w, h, 0, 0, w, h);

        // Convert to base64 PNG
        const base64 = cropCanvas.toDataURL('image/png');

        // Send to our local server endpoint
        fetch('/upload-logo', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ image: base64 })
        })
        .then(res => res.text())
        .then(txt => {
          document.body.innerHTML = '<h1>✅ Logo cropped and uploaded!</h1><p>' + txt + '</p>';
          console.log('Success:', txt);
        })
        .catch(err => {
          document.body.innerHTML = '<h1>❌ Error uploading</h1><p>' + err.message + '</p>';
          console.error(err);
        });
      } else {
        document.body.innerHTML = '<h1>❌ Bounding box not found</h1>';
      }
    };
  </script>
</body>
</html>
